<!DOCTYPE html>
<html class="light" lang="es">
  <head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
    <title>SAMI-Lexmark Dashboard</title>
    
    <!-- Tailwind CSS CDN with forms and container queries plugins -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    
    <style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }
      .glass-effect {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(10px);
      }
      @keyframes pulse-subtle {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.7; }
      }
      .animate-pulse-subtle {
        animation: pulse-subtle 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      body {
        min-height: max(884px, 100dvh);
      }
    </style>

    <!-- Tailwind Configuration matching Stitch UI -->
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
              "primary-container": "#1e40af",
              "outline-variant": "#c4c5d5",
              "surface": "#fbf8ff",
              "on-secondary-fixed-variant": "#38485d",
              "on-tertiary": "#ffffff",
              "inverse-on-surface": "#f1f0fa",
              "on-surface-variant": "#444653",
              "error-container": "#ffdad6",
              "on-primary-fixed": "#001453",
              "background": "#fbf8ff",
              "surface-container": "#eeedf7",
              "on-tertiary-fixed": "#380d00",
              "secondary-fixed-dim": "#b7c8e1",
              "on-background": "#1a1b22",
              "tertiary": "#611e00",
              "inverse-primary": "#b8c4ff",
              "primary-fixed": "#dde1ff",
              "surface-container-lowest": "#ffffff",
              "tertiary-container": "#872d00",
              "outline": "#757684",
              "secondary": "#505f76",
              "on-tertiary-fixed-variant": "#802a00",
              "secondary-fixed": "#d3e4fe",
              "on-primary-container": "#a8b8ff",
              "primary": "#00288e",
              "tertiary-fixed-dim": "#ffb59a",
              "surface-tint": "#3755c3",
              "primary-fixed-dim": "#b8c4ff",
              "on-tertiary-container": "#ffa583",
              "error": "#ba1a1a",
              "on-error-container": "#93000a",
              "on-secondary-container": "#54647a",
              "on-primary-fixed-variant": "#173bab",
              "surface-variant": "#e3e1eb",
              "on-primary": "#ffffff",
              "on-surface": "#1a1b22",
              "surface-container-high": "#e8e7f1",
              "secondary-container": "#d0e1fb",
              "surface-container-low": "#f4f2fc",
              "inverse-surface": "#2f3037",
              "surface-bright": "#fbf8ff",
              "surface-container-highest": "#e3e1eb",
              "on-secondary": "#ffffff",
              "on-error": "#ffffff",
              "on-secondary-fixed": "#0b1c30",
              "surface-dim": "#dad9e3",
              "tertiary-fixed": "#ffdbce"
            },
            "borderRadius": {
              "DEFAULT": "0.25rem",
              "lg": "0.5rem",
              "xl": "0.75rem",
              "full": "9999px"
            },
            "spacing": {
              "container-max": "1440px",
              "gutter": "24px",
              "margin-mobile": "16px",
              "unit": "4px",
              "margin-desktop": "32px"
            },
            "fontFamily": {
              "headline-md": ["Inter"],
              "display": ["Inter"],
              "body-md": ["Inter"],
              "body-lg": ["Inter"],
              "headline-lg-mobile": ["Inter"],
              "label-sm": ["JetBrains Mono"],
              "headline-lg": ["Inter"]
            },
            "fontSize": {
              "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
              "display": ["36px", {"lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
              "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
              "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
              "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
              "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500"}],
              "headline-lg": ["28px", {"lineHeight": "36px", "fontWeight": "600"}]
            }
          },
        },
      }
    </script>
  </head>
  <body class="bg-background text-on-background min-h-screen pb-24 font-body-md text-body-md overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
