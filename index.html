<!DOCTYPE html>
<html class="light" lang="es">
  <head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
    <title>SAMI-Lexmark Dashboard</title>
    
    <!-- Tailwind CSS CDN with forms and container queries plugins -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    
    <style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }
      .glass-effect {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(10px);
      }
      @keyframes pulse-subtle {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.7; }
      }
      .animate-pulse-subtle {
        animation: pulse-subtle 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      body {
        min-height: max(884px, 100dvh);
      }
    </style>

    <!-- Tailwind Configuration matching Stitch UI -->
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
              "primary-container": "#e0f2fe",
              "outline-variant": "#e2e8f0",
              "surface": "#ffffff",
              "on-secondary-fixed-variant": "#475569",
              "on-tertiary": "#ffffff",
              "inverse-on-surface": "#f8fafc",
              "on-surface-variant": "#475569",
              "error-container": "#fee2e2",
              "on-primary-fixed": "#0b1c30",
              "background": "#f8fafc",
              "surface-container": "#f1f5f9",
              "on-tertiary-fixed": "#0369a1",
              "secondary-fixed-dim": "#cbd5e1",
              "on-background": "#0f172a",
              "tertiary": "#0284c7",
              "inverse-primary": "#b8c4ff",
              "primary-fixed": "#d0e1fd",
              "surface-container-lowest": "#ffffff",
              "tertiary-container": "#e0f2fe",
              "outline": "#94a3b8",
              "secondary": "#64748b",
              "on-tertiary-fixed-variant": "#0284c7",
              "secondary-fixed": "#e2e8f0",
              "on-primary-container": "#1d63b8",
              "primary": "#1d63b8",
              "tertiary-fixed-dim": "#7dd3fc",
              "surface-tint": "#1d63b8",
              "primary-fixed-dim": "#b7c8e1",
              "on-tertiary-container": "#0369a1",
              "error": "#ef4444",
              "on-error-container": "#991b1b",
              "on-secondary-container": "#334155",
              "on-primary-fixed-variant": "#1d63b8",
              "surface-variant": "#e2e8f0",
              "on-primary": "#ffffff",
              "on-surface": "#0f172a",
              "surface-container-high": "#e2e8f0",
              "secondary-container": "#f1f5f9",
              "surface-container-low": "#f8fafc",
              "inverse-surface": "#0f172a",
              "surface-bright": "#ffffff",
              "surface-container-highest": "#cbd5e1",
              "on-secondary": "#ffffff",
              "on-error": "#ffffff",
              "on-secondary-fixed": "#0f172a",
              "surface-dim": "#e2e8f0",
              "tertiary-fixed": "#bae6fd"
            },
            "borderRadius": {
              "DEFAULT": "0.25rem",
              "lg": "0.5rem",
              "xl": "0.75rem",
              "full": "9999px"
            },
            "spacing": {
              "container-max": "1440px",
              "gutter": "24px",
              "margin-mobile": "16px",
              "unit": "4px",
              "margin-desktop": "32px"
            },
            "fontFamily": {
              "headline-md": ["Inter"],
              "display": ["Inter"],
              "body-md": ["Inter"],
              "body-lg": ["Inter"],
              "headline-lg-mobile": ["Inter"],
              "label-sm": ["JetBrains Mono"],
              "headline-lg": ["Inter"]
            },
            "fontSize": {
              "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
              "display": ["36px", {"lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
              "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
              "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
              "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
              "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500"}],
              "headline-lg": ["28px", {"lineHeight": "36px", "fontWeight": "600"}]
            }
          },
        },
      }
    </script>
  </head>
  <body class="bg-background text-on-background min-h-screen pb-24 font-body-md text-body-md overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
